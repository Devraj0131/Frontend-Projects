<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>

    <header>
        <h1>Expense <span>Tracker</span></h1>
    </header>

    <main>
        <form class="input-Section" novalidate>
            <h2>Add an expense</h2>

            <div class="field">

                <label for="expenseName">Name:</label>
                <input type="text" id="expenseName" placeholder="Name of Expense" name="expenseName" required>

            </div>

            <div class="field">

                <label for="expenseCategory">Category: </label>
                <select name="expenseCategory" id="expenseCategory" required>
                    <option value="">Select a Category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="essential">Essential</option>
                    <option value="bills">Bills</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>

            </div>


            <div class="field">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" placeholder="Enter the amount" min="0.01" step="0.01" name="amount"
                    required>
            </div>


            <div class="field">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-actions">

                <button id="add" type="submit">Add</button>
                <button id="cancelEdit" type="button" hidden>Cancel edit</button>

            </div>

        </form>

        <section class="mainDisplay" aria-labelledby="overview-title">

            <h2 id="overview-title">Spending overview</h2>

            <p id="totalAmount" class="total-amount" aria-live="polite"></p>
            <p id="errorDisplay" role="alert"></p>


            <div class="expenseList">

                <div class="expenseDisplay food">
                    <h3>Food</h3>
                    <p id="foodTotal"></p>
                </div>

                <div class="expenseDisplay transport">
                    <h3>Transport</h3>
                    <p id="transportTotal"></p>
                </div>

                <div class="expenseDisplay essential">
                    <h3>Essential</h3>
                    <p id="essentialTotal"></p>
                </div>

                <div class="expenseDisplay bills">
                    <h3>Bills</h3>
                    <p id="billsTotal"></p>
                </div>

                <div class="expenseDisplay entertainment">
                    <h3>Entertainment</h3>
                    <p id="entertainmentTotal"></p>
                </div>

                <div class="expenseDisplay other">
                    <h3>Other</h3>
                    <p id="otherTotal"></p>
                </div>

            </div>

        </section>
    </main>

    <footer>
        <p>Keep track of your spending, one expense at a time.</p>
    </footer>


</body>

</html>
